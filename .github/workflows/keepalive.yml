# Бесплатный проект Supabase засыпает после недели без запросов — раз в сутки обращаемся к стенду.
# Нужен секрет репозитория SITE_URL (например, https://gosarhiv-vko.vercel.app). Без него шаг пропускается.
name: Стенд не засыпает
on:
  schedule:
    - cron: "17 3 * * *"
  workflow_dispatch:
permissions: {}
jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Запрос к каталогу (обращается к базе)
        env:
          SITE_URL: ${{ secrets.SITE_URL }}
        run: |
          if [ -z "$SITE_URL" ]; then echo "SITE_URL не задан — пропуск"; exit 0; fi
          curl -fsS -o /dev/null -w "%{http_code}\n" "$SITE_URL/api/catalog?q=%D0%A0-1&tab=funds"
